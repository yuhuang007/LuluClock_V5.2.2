<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="846" viewBox="0 0 1140 846" role="img" aria-labelledby="title description">
  <title id="title">LuluClock 5.2.2 · ESP32-S3 接线总览</title>
  <desc id="description">5.2.2 与 ESP32-S3 N16R8 的接线说明：左舵机 GPIO5、右舵机 GPIO4、舵机单独 5 V，所有信号共地，光源使用独立驱动。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17372c}
      .head{font-size:37px;font-weight:700}
      .section{font-size:24px;font-weight:700}
      .body{font-size:19px}
      .sub{font-size:17px;fill:#4d6358}
      .tag{font-family:Consolas,monospace;font-size:19px;font-weight:700;fill:#176c54}
      .line{fill:none;stroke:#828f83;stroke-width:1}
      .hard{fill:#914a1c}
    </style>
  </defs>
  <rect width="1140" height="846" rx="20" fill="#f3f1e9"/>
  <text x="45" y="65" class="head">LuluClock · 接线总览</text>
  <text x="46" y="99" class="sub">ESP32-S3 N16R8 / 固件 5.2.2 / 左右按面对绘制面认定 / 以开发板 GPIO 丝印为准</text>

  <rect x="42" y="136" width="516" height="399" rx="14" fill="#fffdf5"/>
  <rect x="582" y="136" width="516" height="399" rx="14" fill="#fffdf5"/>
  <text x="67" y="178" class="section">运动与灯光</text>
  <text x="607" y="178" class="section">显示、传感与按键</text>
  <path d="M67 194h466M607 194h466" class="line"/>
  <g class="tag">
    <text x="67" y="227">GPIO5</text>
    <text x="67" y="273">GPIO4</text>
    <text x="67" y="327">GPIO6</text>
    <text x="67" y="389">GPIO11</text>
    <text x="67" y="458">GPIO48</text>
    <text x="607" y="227">GPIO9 / 10</text>
    <text x="607" y="273">GPIO8</text>
    <text x="607" y="319">GPIO18</text>
    <text x="607" y="365">GPIO7</text>
    <text x="607" y="411">GPIO15/16/17</text>
  </g>
  <g class="body">
    <text x="173" y="227">左 SG90 · 信号（舵机电源走 5 V 支路）</text>
    <text x="173" y="273">右 SG90 · 信号</text>
    <text x="173" y="327">灯头 PWM · 高有效</text>
    <text x="173" y="350" class="sub hard">接限流驱动，不直连裸 LED</text>
    <text x="173" y="389">两线灯带 · 开关控制</text>
    <text x="173" y="412" class="sub hard">接外部驱动，另用额定 5 V 供电</text>
    <text x="173" y="458">板载 RGB · 一般不用外接</text>
    <text x="769" y="227">SSD1306 · SDA / SCL</text>
    <text x="769" y="273">光敏模块 · DO</text>
    <text x="769" y="319">DHT11 · DATA</text>
    <text x="769" y="365">无源蜂鸣器模块 · S</text>
    <text x="769" y="411">左 / 中 / 右键 · 按下接地</text>
    <text x="607" y="459" class="sub">模块按实物丝印接线，信号和上拉须为 3.3 V 电平。</text>
  </g>
  <rect x="42" y="559" width="516" height="214" rx="14" fill="#e4eee4"/>
  <rect x="582" y="559" width="516" height="214" rx="14" fill="#e4eee4"/>
  <text x="67" y="600" class="section">电源分支</text>
  <text x="607" y="600" class="section">UART0 维护口</text>
  <g class="body">
    <text x="67" y="637">单一 5 V 稳压电源 → 主控 5 V 输入</text>
    <text x="67" y="670">　　　　　　　　 → 舵机独立分支</text>
    <text x="67" y="705">3.3 V 外设另按模块规格供电，负载共地。</text>
    <text x="67" y="741" class="sub hard">别并联电源；初次上电断开灯光和电池。</text>
    <text x="607" y="637">GPIO43 / TXD → 转接器 RXD</text>
    <text x="607" y="670">GPIO44 / RXD ← 转接器 TXD（3.3 V）</text>
    <text x="607" y="705">GND 共地；另留 GPIO0 / BOOT 和 EN。</text>
    <text x="607" y="741" class="sub hard">TTL VCC 留空；中键 GPIO16 不是 BOOT。</text>
  </g>
  <text x="46" y="814" class="sub">信号与供电分开核对。此图用于台架接线，驱动器、实际电流和电池方案须另行核验。</text>
</svg>
