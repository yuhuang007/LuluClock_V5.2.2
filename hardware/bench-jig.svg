  <text x="134.425" y="172.7" text-anchor="middle">右主动臂　34.85</text>
  <text x="22" y="183.5">L</text>
  <text x="55.5" y="183.5">E</text>
  <text x="116" y="183.5">R</text>
  <text x="151" y="183.5">F</text>
  <path d="M23 206h45.05" class="right"/>
  <use href="#mark" x="23" y="206" class="right"/>
  <use href="#mark" x="68.05" y="206" class="right"/>
