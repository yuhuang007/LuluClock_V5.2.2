<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title description">
  <title id="title">LuluClock 5.2.2 · 1:1 台架定位模板</title>
  <desc id="description">A4 一比一台架定位，舵机轴间距 25 mm。连杆为固件名义孔距；附 50 mm 标尺与 10 mm 方形。</desc>
  <defs>
    <g id="mark" fill="#fff" stroke-width=".32">
      <circle r="1.7"/>
      <path d="M-2.4 0h4.8M0-2.4v4.8" fill="none"/>
    </g>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#203b33;font-size:3.15px}
      .title{font-size:6.3px;font-weight:700}
      .section{font-size:4.25px;font-weight:700}
      .small{font-size:2.85px;fill:#40554d}
      .outline{stroke:#6c8377;stroke-width:.32;fill:none}
      .dimension{stroke:#64796d;stroke-width:.24;fill:none}
      .guide{stroke:#617e70;stroke-width:.3;stroke-dasharray:1.4 1;fill:none}
      .left{stroke:#2a7963;stroke-width:.65;fill:none}
      .right{stroke:#985416;stroke-width:.65;fill:none}
    </style>
  </defs>
  <rect width="210" height="297" fill="#fff"/>
  <text x="12" y="17" class="title">LuluClock · 台架定位模板</text>
  <text x="12" y="25">A4 / 100% 实际大小 / 单位 mm　　打印后先量底部的 50 mm 标尺</text>

  <text x="12" y="36" class="section">01　底板 · 正面看</text>
  <text x="12" y="46" class="small">L 左舵机 GPIO5</text>
  <text x="12" y="52" class="small">R 右舵机 GPIO4</text>
  <text x="12" y="62" class="small">E / F 主动臂端点</text>
  <text x="12" y="68" class="small">P 灯头光斑中心</text>
  <text x="12" y="74" class="small">Q 随动杆关节</text>
  <text x="146" y="47" class="small">80 × 40 蓄光板</text>
  <text x="146" y="53" class="small">安装位置可调</text>
  <text x="146" y="63" class="small">虚线：上传绘图区</text>
  <text x="146" y="69" class="small">X 6…72 / Y 9…36</text>
  <rect x="60" y="42.5" width="80" height="40" rx="0" class="outline"/>
  <rect x="67" y="49" width="66" height="27" class="guide"/>
  <path d="M61 85h9m-2-1 2 1-2 1M61 85v-9m-1 2 1-2 1 2" class="dimension"/>
  <text x="53" y="88.5" class="small">O</text>
  <text x="72" y="88" class="small">X</text>
  <text x="55.5" y="80" class="small">Y</text>
