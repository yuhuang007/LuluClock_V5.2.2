  <use href="#mark" x="100" y="62.5" class="left"/>
  <use href="#mark" x="98.317" y="75.391" class="right"/>
  <use href="#mark" x="139.411" y="93.852" class="right"/>
  <text x="53" y="99">E</text>
  <text x="102.5" y="60">P</text>
  <text x="101" y="79">Q</text>
  <text x="142.5" y="96">F</text>
  <use href="#mark" x="119" y="86" class="dimension"/>
  <path d="M121.4 86h22l2-4" class="dimension"/>
  <text x="146" y="82.5" class="small">归位参考</text>
  <path d="M73 115.5h53" class="guide"/>
  <use href="#mark" x="87.1" y="115.5" class="left"/>
  <use href="#mark" x="112.1" y="115.5" class="right"/>
  <text x="83.8" y="122">L</text>
  <text x="112.8" y="122">R</text>
  <path d="M87.1 124v11m25-11v11M87.1 131h25m-25-1.1 2 1.1-2 1.1m25-2.2-2 1.1 2 1.1" class="dimension"/>
  <text x="99.6" y="128.5" text-anchor="middle">25.00</text>
  <text x="146" y="111" class="small">标轴心，安装耳孔</text>
  <text x="146" y="117" class="small">按舵机实物另量。</text>
  <text x="146" y="125" class="small">图中连杆为参考姿态，</text>
  <text x="146" y="131" class="small">不是运动包络。</text>

  <path d="M12 141.5h186" class="outline"/>
  <text x="12" y="152" class="section">02　固件名义连杆孔距</text>
  <text x="12" y="159.5" class="small">此处为求解参数；随包 STL 孔距以网格为准。核对三孔件朝向，勿镜像。</text>
  <path d="M23 177h33.35M117 177h34.85" class="left"/>
  <use href="#mark" x="23" y="177" class="left"/>
  <use href="#mark" x="56.35" y="177" class="left"/>
