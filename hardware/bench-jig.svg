  <text x="172" y="203">P</text>
  <text x="160.1" y="222">Q</text>
  <text x="124" y="218" class="small">E–Q 45.05</text>
  <text x="173" y="215" class="small">P–Q 13.00</text>

  <path d="M12 231.5h186" class="outline"/>
  <text x="12" y="242" class="section">03　校验打印比例</text>
  <path d="M20 251h50M20 247.5v7m10-7v7m10-7v7m10-7v7m10-7v7m10-7v7" class="outline"/>
  <text x="20" y="260" class="small">0</text>
  <text x="70" y="260" class="small" text-anchor="end">50 mm</text>
  <rect x="114" y="247" width="10" height="10" class="outline"/>
  <text x="130" y="253">10 × 10 mm</text>
  <text x="12" y="273" class="small">用 50 mm 标尺校验后再转印 25 mm 轴间距。灯头间隙与装配公差按实物复核。</text>
  <text x="12" y="282" class="small">几何依据：5.2.2 Geometry.h / drawing-scale.js。此图不评估支架强度与整机行程。</text>
</svg>
